let _mResolve=null;
function toast(msg){let t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.remove('hidden');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.add('hidden'),1700);}
function modal(opts){let m=document.getElementById('modal');
 if(!m){if(opts.input!==undefined){return Promise.resolve(prompt(opts.text||'',opts.input));}return Promise.resolve(confirm(opts.text||''));}
 let tx=document.getElementById('mtext'),inp=document.getElementById('minput'),ok=document.getElementById('mok'),can=document.getElementById('mcan');
 tx.textContent=opts.text||'';if(opts.input!==undefined){inp.value=opts.input;inp.classList.remove('hidden');setTimeout(()=>inp.focus(),50);}else inp.classList.add('hidden');
 ok.textContent=opts.ok||T('mOk');can.textContent=opts.cancel||T('mCancel');can.classList.toggle('hidden',opts.cancel===false);ok.className=opts.danger?'danger':'';
 return new Promise(r=>{_mResolve=r;m.classList.remove('hidden');});}
if(document.getElementById('modal')){
document.getElementById('mok').onclick=()=>{let m=document.getElementById('modal'),inp=document.getElementById('minput');let v=inp.classList.contains('hidden')?true:inp.value;m.classList.add('hidden');_mResolve(v);};
document.getElementById('mcan').onclick=()=>{let m=document.getElementById('modal');m.classList.add('hidden');_mResolve(null);};
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal'){document.getElementById('modal').classList.add('hidden');_mResolve(null);}};
}
async function askConfirm(text){let v=await modal({text:text,ok:T('mOk'),cancel:T('mCancel'),danger:true});return v===true;}
async function askPrompt(text,def){let v=await modal({text:text,input:def||'',ok:T('mOk'),cancel:T('mCancel')});return v;}

 if(sid) await fetch('/api/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:sid})});
 out.innerHTML='';cur=null;off=0;toast(T('toastDel'));};

let sid=null,off=0,gen=-1,out=document.getElementById('out'),cur=null,pollT=null;
let cv=document.getElementById('matrix'),cx=cv.getContext('2d');
function msize(){cv.width=innerWidth;cv.height=innerHeight;}
msize();addEventListener('resize',msize);
let cols=Math.floor(innerWidth/16),drops=Array(cols).fill(0);
setInterval(()=>{cx.fillStyle='rgba(0,0,0,.09)';cx.fillRect(0,0,cv.width,cv.height);
cx.font='14px monospace';
for(let i=0;i<drops.length;i++){cx.fillStyle=Math.random()>.9?'#ff2222':'#00ff41';
cx.fillText(String.fromCharCode(0x30A0+Math.random()*96),i*16,drops[i]*16);
if(drops[i]*16>cv.height&&Math.random()>.975)drops[i]=0;drops[i]++;}},55);
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const FG={30:'#555',31:'#ff5555',32:'#55ff55',33:'#ffff55',34:'#5555ff',35:'#ff55ff',36:'#55ffff',37:'#e6e6e6',90:'#888',91:'#ff8888',92:'#88ff88',93:'#ffff88',94:'#8888ff',95:'#ff88ff',96:'#88ffff',97:'#ffffff'};
function ansiToHtml(t){let out='',open=0;
t=esc(t).replace(/\x1b\[([0-9;]*)m/g,(m,c)=>{let r='';
if(open){r+='</span>';open=0;}
let codes=(c||'0').split(';');
if(codes.includes('0')||c===''){return r;}
let col=codes.find(x=>FG[x]);
if(col){r+='<span style="color:'+FG[col]+'">';open=1;}
if(codes.includes('1')){r+='<span style="font-weight:bold">';open=1;}
return r;});
out=t;if(open)out+='</span>';
return out.replace(/\x1b\[[0-9;?]*[a-zA-Z]/g,'');}
function appendOut(txt){if(!cur)newBlock('···');
let nearBottom=(cur.scrollHeight-cur.scrollTop-cur.clientHeight)<80;
cur.innerHTML+=ansiToHtml(txt);
if(nearBottom)cur.scrollTop=cur.scrollHeight;}
function scrollTop(){window.scrollTo(0,0);}
function newBlock(c){let d=document.createElement('div');d.className='blk';
d.innerHTML='<div class="chead"><span class="prompt">➤</span><span class="cmd"></span><button class="stp" title="'+T('clear')+'">🧹</button><button class="stp">⏹</button><button class="stp updn">⬆</button></div><div class="res"></div><button class="cpy"></button>';d.querySelector('.cpy').textContent=T('cpy');
d.querySelector('.cmd').textContent=c;out.prepend(d);cur=d.querySelector('.res');
 let btns=d.querySelectorAll('.stp');
 btns[0].onclick=async()=>{if(!await askConfirm(T('clrQ')))return;if(sid)await fetch('/api/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:sid})});cur.innerHTML='';d.querySelector('.res').innerHTML='';cur=d.querySelector('.res');toast(T('toastDel'));};
 btns[1].onclick=async()=>{if(!await askConfirm(T('stop_q')))return;await fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:sid})});};
 d.querySelector('.updn').onclick=()=>{let r=d.querySelector('.res');if(r.scrollTop<40)r.scrollTop=r.scrollHeight;else r.scrollTop=0;};
let my=cur;d.querySelector('.cpy').onclick=async e=>{
 try{await navigator.clipboard.writeText(my.textContent);e.target.textContent=T('copied');toast(T('copied'));}catch{toast(T('cpy'));e.target.textContent=T('copied');}
 setTimeout(()=>e.target.textContent=T('cpy'),1600); };
scrollTop();}
async function poll(){clearTimeout(pollT);try{
let r=await fetch('/read?sid='+sid+'&off='+off);
if(!r.ok)return retry();let j=await r.json();
if(j.error)return loadSessions();
if(gen!==-1&&j.gen!==gen){
  // شاشة جديدة: أعد القراءة من الصفر لجلب اللوگو كاملاً
  newBlock(T('screen'));gen=j.gen;off=0;
  let r2=await fetch('/read?sid='+sid+'&off=0');
  if(r2.ok){let k=await r2.json();gen=k.gen;if(k.data)appendOut(k.data);off=k.off;}
}else{gen=j.gen;
  if(j.off<off){newBlock(T('screen'));off=0;}
  else{if(j.data)appendOut(j.data);off=j.off;}}
}catch(e){}pollT=setTimeout(poll,800);}
function retry(){pollT=setTimeout(poll,2500);}
async function loadSessions(){let r=await fetch('/api/sessions');
if(!r.ok)return showLogin();
let list=await r.json();let sl=document.getElementById('slist');sl.innerHTML='';
if(!list.length){await mkSession();return;}
if(!list.find(s=>s.id===sid))sid=list[0].id;
list.forEach(s=>{let d=document.createElement('div');d.className='sitem'+(s.id===sid?' on':'');
let nm=document.createElement('span');nm.className='nm';nm.textContent=s.name;
nm.onclick=()=>{switchSid(s.id);if(innerWidth<700)setSide(false);};
 let rn=document.createElement('button');rn.textContent='✏️';
 rn.onclick=async()=>{let n=await askPrompt(T('sess_name'),s.name);if(n===null||!n.trim())return;
 await fetch('/api/sessions/'+s.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.trim()})});loadSessions();};
 let del=document.createElement('button');del.textContent='🗑️';
 del.onclick=async()=>{if(!await askConfirm(T('delS_q')+'\n'+T('delHint')))return;
 await fetch('/api/sessions/'+s.id,{method:'DELETE'});toast(T('toastDel'));if(s.id===sid){sid=null;off=0;}loadSessions();};
d.append(nm,rn,del);sl.appendChild(d);});
let cur2=list.find(s=>s.id===sid);
document.getElementById('sname').textContent=cur2?('◉ '+cur2.name):'';
out.innerHTML='';cur=null;off=0;poll();}
function switchSid(id){sid=id;out.innerHTML='';cur=null;off=0;gen=-1;loadSessions();}
async function mkSession(){let n=await askPrompt(T('newSess_name'),T('defSess'));
if(n===null)return;let r=await fetch('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:(n||'').trim()||T('defSess')})});
let j=await r.json();if(j.id){sid=j.id;loadSessions();}}
async function send(){let c=document.getElementById('cmd').value;if(!c||!sid)return;
document.getElementById('cmd').value='';newBlock(c);
await fetch('/write?sid='+sid,{method:'POST',body:c+'\n'});}
function showLogin(){document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden');}
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');}

document.getElementById('overlay').classList.toggle('hidden',!(open&&innerWidth<700));}
function toggleSide(){setSide(document.getElementById('side').classList.contains('hide'));}
document.getElementById('menu').onclick=()=>toggleSide();
document.getElementById('xside').onclick=()=>setSide(false);
document.getElementById('overlay').onclick=()=>setSide(false);
document.getElementById('go').onclick=send;
document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('hide');
document.getElementById('newS').onclick=mkSession;
let fdir='/data/work';
function showTab(t){let s=t==='s';
document.getElementById('slist').style.display=s?'':'none';
document.getElementById('newS').style.display=s?'':'none';
document.getElementById('fwrap').classList.toggle('hidden',s);
document.getElementById('tabS').classList.toggle('on',s);
document.getElementById('tabF').classList.toggle('on',!s);
if(!s)loadFiles();}
document.getElementById('tabS').onclick=()=>showTab('s');
document.getElementById('tabF').onclick=()=>showTab('f');
async function loadFiles(){let r=await fetch('/api/files?dir='+encodeURIComponent(fdir));
if(!r.ok)return;let j=await r.json();if(j.error)return;
document.getElementById('fcwd').textContent=j.cwd;let fl=document.getElementById('flist');fl.innerHTML='';
if(j.cwd!=='/'){let up=document.createElement('div');up.className='fitem';
up.innerHTML='<span class="nm">⬆ ..</span>';
up.onclick=()=>{fdir=j.cwd.split('/').slice(0,-1).join('/')||'/';loadFiles();};fl.appendChild(up);}
j.items.forEach(it=>{let d=document.createElement('div');d.className='fitem';
let nm=document.createElement('span');nm.className='nm';nm.textContent=(it.dir?'📁 ':'📄 ')+it.name;
nm.onclick=()=>{if(it.dir){fdir=it.path;loadFiles();}else openEditor(it.path);};
d.appendChild(nm);
if(!it.dir){let rn=document.createElement('button');rn.textContent='▶';
rn.onclick=()=>runFile(it.path);d.appendChild(rn);
let del=document.createElement('button');del.textContent='🗑️';
 del.onclick=async()=>{if(!await askConfirm(T('delF_q')+'\n'+T('delHint')))return;
 await fetch('/api/file?path='+encodeURIComponent(it.path),{method:'DELETE'});toast(T('toastDel'));loadFiles();};
d.appendChild(del);}
fl.appendChild(d);});}
async function openEditor(path){document.getElementById('efile').value=path;
document.getElementById('eta').value=T('loading');
document.getElementById('editor').classList.remove('hidden');
let r=await fetch('/api/file?path='+encodeURIComponent(path));
if(r.ok){let j=await r.json();document.getElementById('eta').value=j.content;}
else document.getElementById('eta').value='';}
async function saveEditor(silent){let p=document.getElementById('efile').value;
if(!p){let fv=await askPrompt(T('fileName_q'),'');if(!fv)return null;p=fv;document.getElementById('efile').value=p;}
let r=await fetch('/api/file',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({path:p,content:document.getElementById('eta').value})});
if(!silent)toast(r.ok?T('saved'):T('failed'),!r.ok);loadFiles();return p;}
document.getElementById('esave').onclick=()=>saveEditor(false);
document.getElementById('ex').onclick=()=>document.getElementById('editor').classList.add('hidden');
document.getElementById('edel').onclick=async()=>{let p=document.getElementById('efile').value;
if(!p||!await askConfirm(T('delF_q')+'\n'+T('delHint')))return;
await fetch('/api/file?path='+encodeURIComponent(p),{method:'DELETE'});
document.getElementById('editor').classList.add('hidden');toast(T('toastDel'));loadFiles();};
document.getElementById('newF').onclick=()=>{document.getElementById('efile').value=fdir+'/';
document.getElementById('eta').value='';document.getElementById('editor').classList.remove('hidden');};
if(document.getElementById('upick')){
const upick=document.getElementById('upick'),ubtn=document.getElementById('ubtn'),ustatus=document.getElementById('ustatus'),dropzone=document.getElementById('dropzone');
if(ubtn)ubtn.onclick=()=>upick.click();
async function doUpload(files,dir){
 let d=dir||fdir; if(!files||!files.length)return;
 for(let f of files){ustatus.textContent=f.name.slice(0,18);
  try{let b=await f.arrayBuffer();
   let r=await fetch('/api/upload?dir='+encodeURIComponent(d),{method:'POST',headers:{'X-Filename':encodeURIComponent(f.name)},body:b});
   let j=await r.json();if(j.ok&&j.size===f.size){toast('✅ '+f.name.slice(0,16)+' ('+f.size+')');}else if(j.ok){toast(T('upBad'),true);}else toast(T('failed')+' '+f.name.slice(0,10),true);
  }catch(e){toast(T('failed'),true);}
 }ustatus.textContent='';if(dir)loadFiles(); else loadFiles();}
upick.onchange=e=>{doUpload(e.target.files);e.target.value='';};
if(dropzone){
dropzone.ondragover=e=>{e.preventDefault();dropzone.style.opacity='1';dropzone.style.borderColor='var(--grn)';};
dropzone.ondragleave=()=>{dropzone.style.opacity='.5';dropzone.style.borderColor='#00ff4155';};
dropzone.ondrop=e=>{e.preventDefault();dropzone.style.opacity='.5';doUpload(e.dataTransfer.files);};
}
}
if(document.getElementById('epick')){
const epick=document.getElementById('epick'),eupload=document.getElementById('eupload'),estatus=document.getElementById('estatus');
if(eupload)eupload.onclick=()=>epick.click();
epick.onchange=async e=>{let fs=e.target.files; if(!fs.length)return;
 let dir=document.getElementById('efile').value; dir=dir?dir.substring(0,dir.lastIndexOf('/'))||'/data/work':fdir;
 for(let f of fs){estatus.textContent=f.name.slice(0,16);
  try{let b=await f.arrayBuffer(); let r=await fetch('/api/upload?dir='+encodeURIComponent(dir),{method:'POST',headers:{'X-Filename':encodeURIComponent(f.name)},body:b});
   let j=await r.json(); if(j.ok&&j.size===f.size){toast('✅ '+f.name.slice(0,16)+' ('+f.size+')'); document.getElementById('efile').value=j.path; let rr=await fetch('/api/file?path='+encodeURIComponent(j.path)); if(rr.ok){let jj=await rr.json(); document.getElementById('eta').value=jj.content;}}
   else if(j.ok){toast(T('upBad'),true);}else toast(T('failed'),true);
  }catch(e){toast(T('failed'),true);}
 }estatus.textContent=''; e.target.value=''; loadFiles();};
}
async function runFile(path){if(!sid){toast(T('pickSess'),true);return;}
await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({path:path,sid:sid})});setSide(false);}
document.getElementById('erun').onclick=async()=>{let p=await saveEditor(true);
if(p){await runFile(p);document.getElementById('editor').classList.add('hidden');}};
document.getElementById('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
async function doLogin(){let r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({u:document.getElementById('lu').value,p:document.getElementById('lp').value})});
if(r.ok){showApp();loadSessions();}else document.getElementById('lerr').textContent=T('wrong');}
document.getElementById('lgo').onclick=doLogin;
document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
if(innerWidth<700)document.getElementById('side').classList.add('hide');
setLang(LANG);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js?v=2').catch(()=>{});
(async()=>{let r=await fetch('/api/sessions');if(r.ok){showApp();loadSessions();}})();
(function(){
const L=document.getElementById('skulls');if(!L)return;
const G=['☠'],A=['skFloat','skSpin','skFlick','skDrift','skPulse','skSink'];
(function(){var L=document.getElementById('leftfx');if(!L)return;try{var n=Math.ceil(innerHeight/24)+4,s='';for(var i=0;i<n;i++)s+='☠<br>';L.innerHTML='<div>'+s+s+'</div>';}catch(_){}})();
const mob=innerWidth<700,r=(a,b)=>a+Math.random()*(b-a);
function add(pos,anim,cls,dur,timing){
const s=document.createElement('span');s.className='sk'+(cls?' '+cls:'');
s.textContent=G[Math.random()*G.length|0];
s.style.cssText=pos+';font-size:'+r(mob?13:18,mob?22:34).toFixed(0)+'px;animation:'+anim+' '+(dur||r(2.5,7)).toFixed(1)+'s '+(timing||'ease-in-out')+' '+(-r(0,8)).toFixed(1)+'s infinite';
L.appendChild(s);}
const n=mob?6:13,m=mob?5:9;
for(let i=0;i<n;i++){const x=((i+.5)/n*100).toFixed(1);
add('left:'+x+'%;top:'+r(0,8).toFixed(0)+'px',A[i%A.length]);
add('left:'+x+'%;bottom:'+r(0,8).toFixed(0)+'px',A[(i+3)%A.length]);}
for(let i=0;i<m;i++){const y=((i+.5)/m*100).toFixed(1);
add('top:'+y+'%;left:'+r(0,10).toFixed(0)+'px',A[(i+1)%A.length]);
add('top:'+y+'%;right:'+r(0,10).toFixed(0)+'px',A[(i+4)%A.length]);}
const f=mob?3:6;
for(let i=0;i<f;i++){const side=i%2?'left':'right';
add(side+':'+r(2,mob?24:60).toFixed(0)+'px','skFall','fall',r(7,14),'linear');}
})();
</script></body></html>
