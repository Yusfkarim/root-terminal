<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--grn:#00ff41;--red:#ff1a1a;--bg:#010401}
body{background:var(--bg);color:var(--grn);font-family:'Courier New',monospace;overflow-x:hidden}
#matrix{position:fixed;inset:0;z-index:0;opacity:.42}

#overlay{position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.6)}

#lbox{width:100%;max-width:360px;background:#000;border:1px solid var(--grn);border-radius:16px;padding:30px 24px;text-align:center;box-shadow:0 0 40px #00ff4155,inset 0 0 30px #00ff4111}
#lbox .skull{font-size:46px;filter:drop-shadow(0 0 10px #ff0000);animation:skullFloat 2.8s ease-in-out infinite,skullGlow 1.8s ease-in-out infinite alternate}

#lgo{width:100%;padding:13px;background:linear-gradient(180deg,#003b00,#001a00);color:var(--grn);border:1px solid var(--grn);border-radius:10px;font-size:18px;font-family:inherit;font-weight:bold}
#lerr{color:#ff5555;min-height:22px;font-size:13px;margin-top:8px}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh}
#head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(180deg,rgba(0,28,2,.96),rgba(0,14,0,.94));border-bottom:1px solid var(--grn);box-shadow:0 0 22px #00ff4444,0 0 0 1px #00ff4111;flex-wrap:wrap;position:relative;overflow:hidden}
#head::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(0,255,65,.06) 50%,transparent 100%);transform:translateX(-100%);animation:headSweep 4.5s 1s infinite;pointer-events:none}
@keyframes headSweep{0%{transform:translateX(-100%)}35%,100%{transform:translateX(100%)}}
#menu{font-size:17px;background:none;border:1px solid var(--grn);color:var(--grn);border-radius:7px;padding:2px 9px}
#root{font-size:15px;font-weight:900;color:#fff;background:linear-gradient(135deg,#ff0000,#6e0000);padding:5px 12px;border-radius:8px;letter-spacing:2.5px;white-space:nowrap;text-shadow:0 0 8px #fff,0 0 22px #ff0000;box-shadow:0 0 26px #ff0000aa,inset 0 0 9px #00000088;animation:blink 2.2s infinite,glitch 4s infinite}
@keyframes blink{50%{box-shadow:0 0 40px #ff0000}}
@keyframes glitch{0%,93%,100%{transform:none}94%{transform:translate(-2px,1px) skewX(8deg)}96%{transform:translate(2px,-1px) skewX(-8deg)}98%{transform:none}}
#title{font-size:12px;color:var(--grn);text-shadow:0 0 6px var(--grn);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sname{font-size:12px;color:var(--grn);text-shadow:0 0 6px var(--grn);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#live{font-size:10px;color:#7dff9b;border:1px solid #00ff41;border-radius:20px;padding:2px 8px;text-shadow:0 0 6px var(--grn);box-shadow:0 0 8px #00ff4455;animation:blink 2s infinite;white-space:nowrap}
#clr{background:#001a00;color:var(--grn);border:1px solid var(--grn);border-radius:7px;padding:5px 10px;font-size:13px}
#lang{background:#2a0000;color:#ffb3b3;border:1px solid var(--red);border-radius:8px;padding:5px 10px;font-size:12px;font-family:inherit}
#main{flex:1;display:flex;overflow:hidden}
#side{width:250px;min-width:250px;background:rgba(0,18,0,.94);border-left:1px solid #00ff4155;display:flex;flex-direction:column;transition:margin .25s}
#side.hide{margin-right:-260px}
.sitem{animation:sitemIn .28s ease}
@keyframes sitemIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.sitem .nm::before{content:"▸";color:var(--red);filter:drop-shadow(0 0 6px var(--red));margin-inline-end:6px;opacity:.0;transition:opacity .2s}
.sitem:hover .nm::before,.sitem.on .nm::before{opacity:1}
.sitem.on{animation:sitemIn .28s ease,skullGlow .9s ease}
.sitem:hover{border-color:#00ff4188;box-shadow:0 0 10px #00ff4133}
#side h3{padding:12px;color:var(--grn);font-size:14px;border-bottom:1px dashed #00ff4155}
#slist{flex:1;overflow-y:auto;padding:8px}
.sitem{display:flex;align-items:center;gap:6px;padding:10px;border:1px solid #00ff4133;border-radius:10px;margin-bottom:8px;background:#000;font-size:14px}

.sitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ccffcc}
.sitem button{background:none;border:none;color:var(--grn);font-size:15px;padding:2px 6px;opacity:.8}
#newS{margin:8px;padding:12px;background:#002200;color:var(--grn);border:1px dashed var(--grn);border-radius:10px;font-size:15px;font-family:inherit}

#tabs button.on{opacity:1;background:rgba(0,255,65,.08);box-shadow:inset 0 -2px 0 var(--grn)}
#langs{display:flex;gap:4px;padding:6px 8px;border-bottom:1px dashed #00ff4155}
#langs button{flex:1;background:#001a00;color:var(--grn);border:1px solid #00ff4155;border-radius:6px;padding:6px 2px;font-size:12px;font-family:inherit;opacity:.6}
#langs button.on{opacity:1;border-color:var(--grn);box-shadow:0 0 8px #00ff4466}
#flist{flex:1;overflow-y:auto;padding:8px}
.fitem{display:flex;align-items:center;gap:6px;padding:10px;border:1px solid #00ff4133;border-radius:10px;margin-bottom:8px;background:#000;font-size:13px}
.fitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ffd97d}
.fitem button{background:none;border:none;font-size:15px;padding:2px 5px}
#fcwd{padding:8px 10px;font-size:11px;color:var(--grn);opacity:.7;word-break:break-all}
#editor{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.96);display:flex;flex-direction:column;padding:10px}
#ebar{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
#upbar{display:flex;gap:6px;align-items:center}
#upbar input[type=file]{display:none}
#efile{flex:1;padding:11px;background:#001100;color:var(--grn);border:1px solid var(--grn);border-radius:8px;font-size:14px;font-family:inherit;min-width:0}
#ebar button{padding:11px 13px;background:#002200;color:var(--grn);border:1px solid var(--grn);border-radius:8px;font-size:15px}
#erun{background:#3d0000!important;color:#ff6666!important;border-color:#ff0000!important}
#eta{flex:1;background:#000;color:#d9ffd9;border:1px solid var(--grn);border-radius:10px;font-size:14px;font-family:monospace;padding:12px;line-height:1.8}
#body{flex:1;display:flex;flex-direction:column;min-width:0}
#out{flex:1;overflow-y:auto;padding:10px}
.blk{background:linear-gradient(180deg,rgba(16,0,0,.5),rgba(0,20,4,.5));border:1px solid #00ff4166;border-right:3px solid var(--red);border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:0 0 16px #00ff4433,0 0 30px #ff000033;position:relative}
.blk::before{content:"";position:absolute;top:0;left:0;width:22px;height:22px;border-top:2px solid var(--red);border-left:2px solid var(--red);border-top-right-radius:0;border-top-left-radius:10px;pointer-events:none}
.blk::after{content:"";position:absolute;bottom:0;right:0;width:22px;height:22px;border-bottom:2px solid var(--red);border-right:2px solid var(--red);border-bottom-right-radius:10px;pointer-events:none}
.blk .chead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px dashed #00ff4155;background:rgba(255,0,0,.07)}
.blk .prompt{color:var(--red);font-weight:bold;text-shadow:0 0 8px #ff0000;font-size:16px}
.blk .cmd{flex:1;color:#7dff9b;font-weight:bold;font-size:14px;word-break:break-all;text-shadow:0 0 6px var(--grn)}
.blk .stp{background:#1e0000;color:#ff5555;border:1px solid #ff0000;border-radius:8px;font-size:15px;padding:5px 12px;cursor:pointer;touch-action:manipulation;min-width:42px}
.blk .stp:active{transform:scale(.92)}
.blk .res{padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-size:14.5px;color:#e2ffe2;min-height:10px;max-height:62dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;line-height:2;text-shadow:0 1px 2px #000,0 0 10px #00ff4499;border-right:2px solid #00ff4133;background:linear-gradient(180deg,rgba(0,14,0,.35),rgba(0,8,2,.35));position:relative;scrollbar-width:thin;scrollbar-color:var(--grn) #001a00}
.blk .res::-webkit-scrollbar{width:8px;height:8px}
.blk .res::-webkit-scrollbar-thumb{background:var(--grn);border-radius:4px}
.blk .res::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,255,65,.035) 2px 3px);pointer-events:none}
.blk .res:empty{display:none}
.cpy{display:block;width:100%;background:#001a00;color:#7dff9b;border:none;border-top:1px solid #00ff4133;padding:9px;font-size:13px;font-family:inherit;cursor:pointer}
#end{height:4px}
#bar{display:flex;gap:6px;padding:10px;background:rgba(0,25,0,.94);border-top:1px solid var(--grn)}
#cmd{flex:1;font-size:16px;padding:13px;background:#000;color:var(--grn);border:1px solid var(--grn);border-radius:12px;font-family:inherit;box-shadow:0 0 10px #00ff4455;min-width:0}
#cmd:focus{outline:none;box-shadow:0 0 16px #00ff4488}
#go{font-size:19px;padding:10px 22px;background:linear-gradient(180deg,#004d00,#002200);color:var(--grn);border:1px solid var(--grn);border-radius:12px}
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{width:100%;max-width:320px;background:#000;border:1px solid var(--grn);border-radius:12px;padding:16px;text-align:center;box-shadow:0 0 20px #00ff4155}
.mbox p{font-size:14px;line-height:1.7;color:var(--grn);margin-bottom:12px;white-space:pre-wrap}
.mbox input{width:100%;padding:10px;background:#001100;color:var(--grn);border:1px solid var(--grn);border-radius:8px;font-size:14px;font-family:inherit;text-align:center;margin-bottom:12px}
.mbox .mbtns{display:flex;gap:8px}
.mbox .mbtns button{flex:1;padding:10px;background:#001a00;color:var(--grn);border:1px solid var(--grn);border-radius:8px;font-size:14px;font-family:inherit}
.mbox .mbtns button.danger{background:#2a0000;color:#ff6666;border-color:#ff0000}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:31;background:#001a00;color:var(--grn);border:1px solid var(--grn);border-radius:8px;padding:7px 14px;font-size:13px;box-shadow:0 0 12px #00ff4155;pointer-events:none}
.hidden{display:none!important}
@media(max-width:700px){#side{position:fixed;top:0;bottom:0;right:0;z-index:15;height:100dvh}}
</style></head><body>

function modal(opts){let m=document.getElementById('modal'),tx=document.getElementById('mtext'),inp=document.getElementById('minput'),ok=document.getElementById('mok'),can=document.getElementById('mcan');
 tx.textContent=opts.text||'';if(opts.input!==undefined){inp.value=opts.input;inp.classList.remove('hidden');setTimeout(()=>inp.focus(),50);}else inp.classList.add('hidden');
 ok.textContent=opts.ok||T('mOk');can.textContent=opts.cancel||T('mCancel');can.classList.toggle('hidden',opts.cancel===false);ok.className=opts.danger?'danger':'';
 return new Promise(r=>{_mResolve=r;m.classList.remove('hidden');});}
document.getElementById('mok').onclick=()=>{let m=document.getElementById('modal'),inp=document.getElementById('minput');let v=inp.classList.contains('hidden')?true:inp.value;m.classList.add('hidden');_mResolve(v);};
document.getElementById('mcan').onclick=()=>{let m=document.getElementById('modal');m.classList.add('hidden');_mResolve(null);};
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal'){document.getElementById('modal').classList.add('hidden');_mResolve(null);}};
async function askConfirm(text){let v=await modal({text:text,ok:T('mOk'),cancel:T('mCancel'),danger:true});return v===true;}
async function askPrompt(text,def){let v=await modal({text:text,input:def||'',ok:T('mOk'),cancel:T('mCancel')});return v;}

document.getElementById('title').textContent=T('title');

 if(sid) await fetch('/api/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:sid})});
 out.innerHTML='';cur=null;off=0;toast(T('toastDel'));};

document.getElementById('tabF').textContent=T('tabF');

if(sid)loadSessions();}

let sid=null,off=0,gen=-1,out=document.getElementById('out'),cur=null,pollT=null;
let cv=document.getElementById('matrix'),cx=cv.getContext('2d');
function msize(){cv.width=innerWidth;cv.height=innerHeight;}
msize();addEventListener('resize',msize);
let cols=Math.floor(innerWidth/16),drops=Array(cols).fill(0);
setInterval(()=>{cx.fillStyle='rgba(0,0,0,.09)';cx.fillRect(0,0,cv.width,cv.height);
cx.font='14px monospace';
for(let i=0;i<drops.length;i++){cx.fillStyle=Math.random()>.9?'#ff2222':'#00ff41';
cx.fillText(String.fromCharCode(0x30A0+Math.random()*96),i*16,drops[i]*16);
if(drops[i]*16>cv.height&&Math.random()>.975)drops[i]=0;drops[i]++;}},55);
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const FG={30:'#555',31:'#ff5555',32:'#55ff55',33:'#ffff55',34:'#5555ff',35:'#ff55ff',36:'#55ffff',37:'#e6e6e6',90:'#888',91:'#ff8888',92:'#88ff88',93:'#ffff88',94:'#8888ff',95:'#ff88ff',96:'#88ffff',97:'#ffffff'};
function ansiToHtml(t){let out='',open=0;
t=esc(t).replace(/\x1b\[([0-9;]*)m/g,(m,c)=>{let r='';
if(open){r+='</span>';open=0;}
let codes=(c||'0').split(';');
if(codes.includes('0')||c===''){return r;}
let col=codes.find(x=>FG[x]);
if(col){r+='<span style="color:'+FG[col]+'">';open=1;}
if(codes.includes('1')){r+='<span style="font-weight:bold">';open=1;}
return r;});
out=t;if(open)out+='</span>';
return out.replace(/\x1b\[[0-9;?]*[a-zA-Z]/g,'');}
function appendOut(txt){if(!cur)newBlock('···');
let nearBottom=(cur.scrollHeight-cur.scrollTop-cur.clientHeight)<80;
cur.innerHTML+=ansiToHtml(txt);
if(nearBottom)cur.scrollTop=cur.scrollHeight;}
function scrollTop(){window.scrollTo(0,0);}
function newBlock(c){let d=document.createElement('div');d.className='blk';
d.innerHTML='<div class="chead"><span class="prompt">➤</span><span class="cmd"></span><button class="stp" title="'+T('clear')+'">🧹</button><button class="stp">⏹</button><button class="stp updn">⬆</button></div><div class="res"></div><button class="cpy"></button>';d.querySelector('.cpy').textContent=T('cpy');
d.querySelector('.cmd').textContent=c;out.prepend(d);cur=d.querySelector('.res');
 let btns=d.querySelectorAll('.stp');
 btns[0].onclick=async()=>{if(!await askConfirm(T('clrQ')))return;if(sid)await fetch('/api/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:sid})});cur.innerHTML='';d.querySelector('.res').innerHTML='';cur=d.querySelector('.res');toast(T('toastDel'));};
 btns[1].onclick=async()=>{if(!await askConfirm(T('stop_q')))return;await fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:sid})});};
 d.querySelector('.updn').onclick=()=>{let r=d.querySelector('.res');if(r.scrollTop<40)r.scrollTop=r.scrollHeight;else r.scrollTop=0;};
let my=cur;d.querySelector('.cpy').onclick=async e=>{
 try{await navigator.clipboard.writeText(my.textContent);e.target.textContent=T('copied');toast(T('copied'));}catch{toast(T('cpy'));e.target.textContent=T('copied');}
 setTimeout(()=>e.target.textContent=T('cpy'),1600); };
scrollTop();}
async function poll(){clearTimeout(pollT);try{
let r=await fetch('/read?sid='+sid+'&off='+off);
if(!r.ok)return retry();let j=await r.json();
if(j.error)return loadSessions();
if(gen!==-1&&j.gen!==gen){
  // شاشة جديدة: أعد القراءة من الصفر لجلب اللوگو كاملاً
  newBlock(T('screen'));gen=j.gen;off=0;
  let r2=await fetch('/read?sid='+sid+'&off=0');
  if(r2.ok){let k=await r2.json();gen=k.gen;if(k.data)appendOut(k.data);off=k.off;}
}else{gen=j.gen;
  if(j.off<off){newBlock(T('screen'));off=0;}
  else{if(j.data)appendOut(j.data);off=j.off;}}
}catch(e){}pollT=setTimeout(poll,800);}
function retry(){pollT=setTimeout(poll,2500);}
async function loadSessions(){let r=await fetch('/api/sessions');
if(!r.ok)return showLogin();
let list=await r.json();let sl=document.getElementById('slist');sl.innerHTML='';
if(!list.length){await mkSession();return;}
if(!list.find(s=>s.id===sid))sid=list[0].id;
list.forEach(s=>{let d=document.createElement('div');d.className='sitem'+(s.id===sid?' on':'');
let nm=document.createElement('span');nm.className='nm';nm.textContent=s.name;
nm.onclick=()=>{switchSid(s.id);if(innerWidth<700)setSide(false);};
 let rn=document.createElement('button');rn.textContent='✏️';
 rn.onclick=async()=>{let n=await askPrompt(T('sess_name'),s.name);if(n===null||!n.trim())return;
 await fetch('/api/sessions/'+s.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.trim()})});loadSessions();};
 let del=document.createElement('button');del.textContent='🗑️';
 del.onclick=async()=>{if(!await askConfirm(T('delS_q')+'\n'+T('delHint')))return;
 await fetch('/api/sessions/'+s.id,{method:'DELETE'});toast(T('toastDel'));if(s.id===sid){sid=null;off=0;}loadSessions();};
d.append(nm,rn,del);sl.appendChild(d);});
let cur2=list.find(s=>s.id===sid);
document.getElementById('sname').textContent=cur2?('◉ '+cur2.name):'';
out.innerHTML='';cur=null;off=0;poll();}
function switchSid(id){sid=id;out.innerHTML='';cur=null;off=0;gen=-1;loadSessions();}
async function mkSession(){let n=await askPrompt(T('newSess_name'),T('defSess'));
if(n===null)return;let r=await fetch('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:(n||'').trim()||T('defSess')})});
let j=await r.json();if(j.id){sid=j.id;loadSessions();}}
async function send(){let c=document.getElementById('cmd').value;if(!c||!sid)return;
document.getElementById('cmd').value='';newBlock(c);
await fetch('/write?sid='+sid,{method:'POST',body:c+'\n'});}
function showLogin(){document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden');}
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');}
function setSide(open){document.getElementById('side').classList.toggle('hide',!open);
document.getElementById('overlay').classList.toggle('hidden',!(open&&innerWidth<700));}
function toggleSide(){setSide(document.getElementById('side').classList.contains('hide'));}
document.getElementById('menu').onclick=()=>toggleSide();
document.getElementById('xside').onclick=()=>setSide(false);
document.getElementById('overlay').onclick=()=>setSide(false);
document.getElementById('go').onclick=send;
document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('hide');
document.getElementById('newS').onclick=mkSession;
let fdir='/data/work';
function showTab(t){let s=t==='s';
document.getElementById('slist').style.display=s?'':'none';
document.getElementById('newS').style.display=s?'':'none';
document.getElementById('fwrap').classList.toggle('hidden',s);
document.getElementById('tabS').classList.toggle('on',s);
document.getElementById('tabF').classList.toggle('on',!s);
if(!s)loadFiles();}
document.getElementById('tabS').onclick=()=>showTab('s');
document.getElementById('tabF').onclick=()=>showTab('f');
async function loadFiles(){let r=await fetch('/api/files?dir='+encodeURIComponent(fdir));
if(!r.ok)return;let j=await r.json();if(j.error)return;
document.getElementById('fcwd').textContent=j.cwd;let fl=document.getElementById('flist');fl.innerHTML='';
if(j.cwd!=='/'){let up=document.createElement('div');up.className='fitem';
up.innerHTML='<span class="nm">⬆ ..</span>';
up.onclick=()=>{fdir=j.cwd.split('/').slice(0,-1).join('/')||'/';loadFiles();};fl.appendChild(up);}
j.items.forEach(it=>{let d=document.createElement('div');d.className='fitem';
let nm=document.createElement('span');nm.className='nm';nm.textContent=(it.dir?'📁 ':'📄 ')+it.name;
nm.onclick=()=>{if(it.dir){fdir=it.path;loadFiles();}else openEditor(it.path);};
d.appendChild(nm);
if(!it.dir){let rn=document.createElement('button');rn.textContent='▶';
rn.onclick=()=>runFile(it.path);d.appendChild(rn);
let del=document.createElement('button');del.textContent='🗑️';
 del.onclick=async()=>{if(!await askConfirm(T('delF_q')+'\n'+T('delHint')))return;
 await fetch('/api/file?path='+encodeURIComponent(it.path),{method:'DELETE'});toast(T('toastDel'));loadFiles();};
d.appendChild(del);}
fl.appendChild(d);});}
async function openEditor(path){document.getElementById('efile').value=path;
document.getElementById('eta').value='... جار التحميل ...';
document.getElementById('editor').classList.remove('hidden');
let r=await fetch('/api/file?path='+encodeURIComponent(path));
if(r.ok){let j=await r.json();document.getElementById('eta').value=j.content;}
else document.getElementById('eta').value='';}
async function saveEditor(silent){let p=document.getElementById('efile').value;
if(!p){let fv=await askPrompt(T('fileName_q'),'');if(!fv)return null;p=fv;}
let r=await fetch('/api/file',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({path:p,content:document.getElementById('eta').value})});
if(!silent){let m=r.ok?T('saved'):T('failed');if(r.ok)toast(m);else if(confirm(m)){} // minimal fall-back
 document.getElementById('efile').value=p;}loadFiles();return p;}
document.getElementById('esave').onclick=()=>saveEditor(false);
document.getElementById('ex').onclick=()=>document.getElementById('editor').classList.add('hidden');
document.getElementById('edel').onclick=async()=>{let p=document.getElementById('efile').value;
if(!p||!await askConfirm(T('delF_q')+'\n'+T('delHint')))return;
await fetch('/api/file?path='+encodeURIComponent(p),{method:'DELETE'});
document.getElementById('editor').classList.add('hidden');toast(T('toastDel'));loadFiles();};
document.getElementById('newF').onclick=()=>{document.getElementById('efile').value=fdir+'/';
document.getElementById('eta').value='';document.getElementById('editor').classList.remove('hidden');};
const upick=document.getElementById('upick'),ubtn=document.getElementById('ubtn'),ustatus=document.getElementById('ustatus'),dropzone=document.getElementById('dropzone');
ubtn.onclick=()=>upick.click();
async function doUpload(files,dir){
 let d=dir||fdir; if(!files||!files.length)return;
 for(let f of files){ustatus.textContent=f.name.slice(0,18);
  try{let b=await f.arrayBuffer();
   let r=await fetch('/api/upload?dir='+encodeURIComponent(d),{method:'POST',headers:{'X-Filename':encodeURIComponent(f.name)},body:b});
   let j=await r.json();if(j.ok){toast('✅ '+f.name.slice(0,16));}else toast(T('failed')+' '+f.name.slice(0,10),true);
  }catch(e){toast(T('failed'),true);}
 }ustatus.textContent='';if(dir)loadFiles(); else loadFiles();}
upick.onchange=e=>{doUpload(e.target.files);e.target.value='';};
dropzone.ondragover=e=>{e.preventDefault();dropzone.style.opacity='1';dropzone.style.borderColor='var(--grn)';};
dropzone.ondragleave=()=>{dropzone.style.opacity='.5';dropzone.style.borderColor='#00ff4155';};
dropzone.ondrop=e=>{e.preventDefault();dropzone.style.opacity='.5';doUpload(e.dataTransfer.files);};
const epick=document.getElementById('epick'),eupload=document.getElementById('eupload'),estatus=document.getElementById('estatus');
eupload.onclick=()=>epick.click();
epick.onchange=async e=>{let fs=e.target.files; if(!fs.length)return;
 let dir=document.getElementById('efile').value; dir=dir?dir.substring(0,dir.lastIndexOf('/'))||'/data/work':fdir;
 for(let f of fs){estatus.textContent=f.name.slice(0,16);
  try{let b=await f.arrayBuffer(); let r=await fetch('/api/upload?dir='+encodeURIComponent(dir),{method:'POST',headers:{'X-Filename':encodeURIComponent(f.name)},body:b});
   let j=await r.json(); if(j.ok){toast('✅ '+f.name.slice(0,16)); document.getElementById('efile').value=j.path; let rr=await fetch('/api/file?path='+encodeURIComponent(j.path)); if(rr.ok){let jj=await rr.json(); document.getElementById('eta').value=jj.content;}}
   else toast(T('failed'),true);
  }catch(e){toast(T('failed'),true);}
 }estatus.textContent=''; e.target.value=''; loadFiles();};
const origLoadFiles=loadFiles;

await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({path:path,sid:sid})});setSide(false);}

body:JSON.stringify({u:document.getElementById('lu').value,p:document.getElementById('lp').value})});
if(r.ok){showApp();loadSessions();}else document.getElementById('lerr').textContent=T('wrong');}

if(innerWidth<700)document.getElementById('side').classList.add('hide');
setLang(LANG);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
(async()=>{let r=await fetch('/api/sessions');if(r.ok){showApp();loadSessions();}})();
